[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kicad-ir"
version = "0.1.0"
description = "Minimal PCB routing IR and A* router for KiCad experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vincent Lordier" }]
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
kicad-ir-route-demo = "kicad_ir.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_ir"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
